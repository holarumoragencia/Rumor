<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Rumor · Everyone's talking (reel)</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: #000; }
  body { display: grid; place-items: center; min-height: 100vh; overflow: hidden; }
  body.capture { display: block; min-height: 0; }
  #stage { position: relative; width: 1080px; height: 1920px; overflow: hidden; transform-origin: top left; }
  #stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
</style>
</head>
<body>
<div id="stage"><canvas id="gl" width="1080" height="1920"></canvas></div>
<script>
/* ============================================================
   Rumor · "Everyone's talking. Are they talking about you?"
   - 3 momentos (inglés → español → spanglish), 4 s cada uno.
     En cada momento: deformado → CALMA (se lee) → deformado. El cambio de idioma
     ocurre mientras está deformado, así no se nota el corte.
   - La frase va partida en dos renglones que se alternan.
   - Post-proceso de pantalla retro (CRT): resplandor, aberración cromática,
     líneas de barrido, temblor horizontal, parpadeo y grano. Sin marco.
   Versiones: ?bg=black (default) | ?bg=cream. Loop perfecto de DURATION s.
   ============================================================ */
const SEG = 4;                      // segundos por idioma
const LANGS = [
  // cada idioma: dos renglones que se alternan; [antes, ACENTO, después]
  [["Everyone's talking.", "", ""], ["Are they talking about ", "you", "?"]],   // inglés
  [["Todos hablan.", "", ""],       ["¿Hablan de ", "vos", "?"]],               // español
  [["Everyone's hablando.", "", ""], ["¿Are they talking de ", "vos", "?"]],    // spanglish
];
const DURATION = SEG * LANGS.length;

// --- Paleta Rumor ---
const hex = h => [1,3,5].map(i => parseInt(h.slice(i, i + 2), 16) / 255);
const PAL = {
  black: hex('#191919'), cream: hex('#fffcf1'),
  blue: hex('#003afe'), blue2: hex('#0057ff'),
  crimson: hex('#fd6e88'),   // acento crimson pink
};
const params = new URLSearchParams(location.search);
const MODE = params.get('bg') === 'cream' ? 'cream' : 'black';
const mixc = (a, b, k) => a.map((v, i) => v * (1 - k) + b[i] * k);
// fondo, tinta principal, tinta secundaria (capa suave de atrás), acento
const THEME = MODE === 'cream'
  ? { bg: PAL.cream, inkA: PAL.blue, inkB: PAL.black, accent: PAL.crimson, light: 0 }
  : { bg: PAL.black, inkA: PAL.blue2, inkB: mixc(PAL.blue2, PAL.cream, 0.4), accent: PAL.crimson, light: 1 };

if (params.has('capture')) document.body.classList.add('capture');
else {
  const fit = () => { const s = Math.min(innerWidth / 1080, innerHeight / 1920);
    document.getElementById('stage').style.transform = `scale(${s})`;
    document.getElementById('stage').style.marginBottom = `${1920 * (s - 1)}px`; };
  fit(); addEventListener('resize', fit);
}

// ---------- Texturas de texto (una por idioma, mosaico sin costuras) ----------
const TEX = 4096;
function buildTextTexture(rowsDef) {
  const c = document.createElement('canvas');
  c.width = c.height = TEX;
  const x = c.getContext('2d');
  x.fillStyle = '#000'; x.fillRect(0, 0, TEX, TEX);
  const ROWS = 20;                       // ≈205 texeles por fila -> interlineado amplio
  const rowH = TEX / ROWS;
  x.font = 'bold 104px Arial, "Liberation Sans", Helvetica, sans-serif';
  x.textBaseline = 'middle';
  const GAP = 150;
  for (let r = 0; r < ROWS; r++) {
    const segs = rowsDef[r % rowsDef.length];
    const w = segs.reduce((a, s) => a + x.measureText(s).width, 0) + GAP;
    const n = Math.max(1, Math.round(TEX / w));
    const sx = TEX / (n * w);
    const shift = ((r * 0.37) % 1) * w;
    const y = r * rowH + rowH / 2;
    for (let k = -1; k <= n; k++) {
      let px = k * w + shift;
      segs.forEach((s, i) => {
        if (!s) return;
        x.fillStyle = i === 1 ? '#00ff00' : '#ff0000';   // R = texto, G = acento
        x.setTransform(sx, 0, 0, 1, 0, 0);
        x.fillText(s, px, y);
        px += x.measureText(s).width;
      });
    }
    x.setTransform(1, 0, 0, 1, 0, 0);
  }
  return c;
}

// ---------- WebGL ----------
const cv = document.getElementById('gl');
const gl = cv.getContext('webgl', { preserveDrawingBuffer: true, antialias: false });
const W = cv.width, H = cv.height, FBO = 2048;

const VS = `attribute vec2 p; void main(){ gl_Position = vec4(p, 0., 1.); }`;

/* ---- Pasada 1: escena (texto deformado) ---- */
const FS_SCENE = `
precision highp float;
uniform sampler2D texA, texB;   // idioma actual y siguiente
uniform float langMix;          // 0 = texA, 1 = texB
uniform vec2 res;
uniform float ph;               // fase del loop 0..1
uniform float amp;              // intensidad de la deformación (0.1 calma … 1 máximo)
uniform vec3 bg, inkA, inkB, accent;
uniform float light;
const float TAU = 6.2831853;
const float TEX = 4096.;

vec2 rot(vec2 v, float a){ float c = cos(a), s = sin(a); return vec2(c*v.x - s*v.y, s*v.x + c*v.y); }

vec2 vortex(vec2 q, vec2 c, float R, float spin, float mag, inout float depth){
  vec2 d = q - c;
  float k = exp(-dot(d, d) / (R * R));
  d = rot(d, spin * k);
  d *= mix(1., 1. / mag, k);
  depth += k * (mag < 1. ? -(1. - mag) : 0.);
  return c + d;
}

vec2 warp(vec2 p, float a, out float depth){
  depth = 0.;
  vec2 q = p;
  float s1 = sin(a), c1 = cos(a), s2 = sin(2. * a);
  // ondas líquidas (40% menos que antes y casi nulas en la calma)
  q.x += amp * (28. * sin(q.y * 0.0042 + 2. * a + 1.3) + 5. * sin(q.y * 0.008 - 3. * a));
  q.y += amp * (24. * sin(q.x * 0.0037 - 2. * a) + 4. * cos(q.x * 0.009 + 3. * a));
  // franja que estira las letras (solo cuando deforma)
  float bx = 240. * sin(a * 3. + 0.6);
  float band = exp(-pow((q.x - bx) / 80., 2.)) * amp * amp;
  q.y = mix(q.y, q.y * 0.35, band * 0.6);
  // túnel suave
  vec2 ct = vec2(180. * c1, -120. + 220. * s1);
  q = vortex(q, ct, 420., 0.35 * s1 * amp, mix(1., 0.62, amp), depth);
  // lupa: agranda la frase hacia el centro de la pantalla (zona segura de IG)
  vec2 cA = vec2(60. * sin(3. * a), -120. + 90. * cos(3. * a));
  q = vortex(q, cA, 360., 0.25 * s2 * amp, 1. + 1.5 * amp, depth);
  return q;
}

vec3 sampleLang(vec2 uv, float bias){
  vec3 a = vec3(texture2D(texA, uv, bias).rg, 0.);
  vec3 b = vec3(texture2D(texB, uv, bias).rg, 0.);
  return mix(a, b, langMix);
}
// x = texto, y = acento, z = acento difuminado (halo gaussiano vía mipmaps)
vec3 sampleText(vec2 p, float a, vec2 drift, float bias, out float depth){
  vec2 q = warp(p, a, depth);
  vec2 uv = (q * 1.6 + drift) / TEX;           // 1.6 texeles por pixel -> letra base ~65px
  vec3 t = sampleLang(uv, bias);
  float halo = 0.5 * sampleLang(uv, 4.6).g + 0.5 * sampleLang(uv, 6.2).g;
  return vec3(t.xy, halo);
}

void main(){
  vec2 p = gl_FragCoord.xy - res * 0.5;
  p.y = -p.y;
  float a = ph * TAU;
  vec2 drift = vec2(900. + 260. * cos(a), 1300. + 160. * sin(a));

  float dA, dB;
  vec3 tA = sampleText(p, a, drift, 0., dA);                                   // capa principal, nítida
  vec3 tB = sampleText(p + vec2(3., -2.), a - 0.04, drift, 3.0, dB);            // capa de atrás, difusa

  float dim = clamp(1. + 0.75 * dA, 0.3, 1.);
  float mA = tA.x * dim;
  float mB = max(tB.x, tB.y) * clamp(1. + 0.75 * dB, 0.3, 1.) * (1. - mA);
  float acc = tA.y * dim;

  float glow = smoothstep(0.0, 0.11, tA.z) * dim;     // el rosa salpica a las letras vecinas
  vec3 cA = mix(inkA, accent, glow * 0.85);
  vec3 cB = mix(inkB, accent, glow * 0.7);

  vec3 col = bg;
  if (light > 0.5) {
    col += accent * glow * 0.2;
    col = mix(col, cB, mB * 0.55);
    col = mix(col, cA * 1.1, clamp(mA * 1.15, 0., 1.));
  } else {
    col = mix(col, accent, glow * 0.14);
    col = mix(col, cB, mB * 0.35);
    col = mix(col, cA, clamp(mA * 1.2, 0., 1.));
  }
  col = mix(col, accent, clamp(acc * 1.1, 0., 1.));
  gl_FragColor = vec4(clamp(col, 0., 1.), 1.);
}`;

/* ---- Pasada 2: pantalla retro (CRT) ---- */
const FS_CRT = `
precision highp float;
uniform sampler2D scene;
uniform vec2 res;
uniform float fbo;
uniform float ph;
uniform float frame;
uniform vec3 bg;
uniform float light;
const float TAU = 6.2831853;
float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
vec3 S(vec2 px, float bias){ return texture2D(scene, clamp(px, vec2(1.), res - 1.) / fbo, bias).rgb; }

void main(){
  vec2 px = gl_FragCoord.xy;
  float y = res.y - px.y;
  // temblor horizontal por línea + una franja de "tracking" que baja
  float line = floor(y / 3.);
  float jit = (hash(vec2(line, frame)) - 0.5) * 1.6;
  float bandY = fract(ph * 2.) * (res.y + 400.) - 200.;
  float track = exp(-pow((y - bandY) / 60., 2.));
  jit += track * (hash(vec2(line * 0.37, frame + 3.)) - 0.5) * 14.;
  px.x += jit;

  // aberración cromática (mayor hacia los bordes)
  float edge = abs(px.x / res.x - 0.5) * 2.;
  float ca = 2. + 2.5 * edge;
  vec3 col;
  col.r = S(px + vec2(ca, 0.), 0.).r;
  col.g = S(px, 0.).g;
  col.b = S(px - vec2(ca, 0.), 0.).b;

  // resplandor de fósforo (bloom) a partir de mipmaps
  vec3 b1 = S(px, 3.5), b2 = S(px, 5.), b3 = S(px, 6.5);
  vec3 bloom = b1 * 0.45 + b2 * 0.35 + b3 * 0.2;
  if (light > 0.5) col += max(bloom - bg, 0.) * 0.95;
  else col = mix(col, min(col, bloom), 0.35);

  // líneas de barrido (cada 4 px) y franja de tracking un poco más clara
  float scan = 0.5 + 0.5 * cos(y * TAU / 4.);
  col *= mix(light > 0.5 ? 0.72 : 0.9, 1.0, scan);
  col += track * (light > 0.5 ? 0.05 : 0.025);

  // parpadeo, grano y viñeta
  col *= 1. + 0.03 * sin(ph * TAU * 24.) + (hash(vec2(frame, 7.)) - 0.5) * 0.04;
  col += (hash(px + frame * 13.1) - 0.5) * (light > 0.5 ? 0.06 : 0.045);
  vec2 uv = gl_FragCoord.xy / res - 0.5;
  float vig = smoothstep(0.95, 0.3, length(uv * vec2(1.0, 0.8)));
  col = mix(bg * (light > 0.5 ? 0.5 : 0.93), col, 0.5 + 0.5 * vig);
  gl_FragColor = vec4(clamp(col, 0., 1.), 1.);
}`;

function sh(type, src) {
  const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
  return s;
}
function program(fs) {
  const pr = gl.createProgram();
  gl.attachShader(pr, sh(gl.VERTEX_SHADER, VS));
  gl.attachShader(pr, sh(gl.FRAGMENT_SHADER, fs));
  gl.linkProgram(pr);
  if (!gl.getProgramParameter(pr, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(pr));
  const u = {}; const n = gl.getProgramParameter(pr, gl.ACTIVE_UNIFORMS);
  for (let i = 0; i < n; i++) { const nm = gl.getActiveUniform(pr, i).name; u[nm] = gl.getUniformLocation(pr, nm); }
  return { pr, u };
}
const buf = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, buf);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
const P1 = program(FS_SCENE), P2 = program(FS_CRT);

function mipTexture(src, w, h) {
  const t = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, t);
  if (src) gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, src);
  else gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, w, h, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, src ? gl.REPEAT : gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, src ? gl.REPEAT : gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR_MIPMAP_LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  if (src) gl.generateMipmap(gl.TEXTURE_2D);
  return t;
}

let ready = false, langTex = [], sceneTex, fb;
function init() {
  langTex = LANGS.map(l => mipTexture(buildTextTexture(l)));
  sceneTex = mipTexture(null, FBO, FBO);
  fb = gl.createFramebuffer();
  gl.bindFramebuffer(gl.FRAMEBUFFER, fb);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, sceneTex, 0);
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  ready = true;
}

const smooth = (a, b, x) => { const t = Math.min(1, Math.max(0, (x - a) / (b - a))); return t * t * (3 - 2 * t); };

function draw(prog) {
  gl.useProgram(prog.pr);
  const loc = gl.getAttribLocation(prog.pr, 'p');
  gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
}

function render(t) {
  if (!ready) return;
  t = ((t % DURATION) + DURATION) % DURATION;
  const seg = Math.floor(t / SEG), s = (t % SEG) / SEG;
  // deformación: máxima en los bordes del momento, calma en el medio (≈1,6 s legible)
  const calm = smooth(0.12, 0.3, s) * (1 - smooth(0.7, 0.88, s));
  const amp = 1 - 0.92 * calm;
  // cambio de idioma en el pico de deformación, con fundido corto
  const next = (seg + 1) % LANGS.length;
  const lm = smooth(0.93, 1.0, s);

  // pasada 1 -> framebuffer
  gl.bindFramebuffer(gl.FRAMEBUFFER, fb);
  gl.viewport(0, 0, FBO, FBO);
  gl.clearColor(...THEME.bg, 1); gl.clear(gl.COLOR_BUFFER_BIT);   // así el bloom no oscurece los bordes
  gl.viewport(0, 0, W, H);
  draw(P1);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, langTex[seg]);
  gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, langTex[next]);
  const u1 = P1.u;
  gl.uniform1i(u1.texA, 0); gl.uniform1i(u1.texB, 1);
  gl.uniform1f(u1.langMix, lm);
  gl.uniform2f(u1.res, W, H);
  gl.uniform1f(u1.ph, t / DURATION);
  gl.uniform1f(u1.amp, amp);
  gl.uniform3fv(u1.bg, THEME.bg); gl.uniform3fv(u1.inkA, THEME.inkA);
  gl.uniform3fv(u1.inkB, THEME.inkB); gl.uniform3fv(u1.accent, THEME.accent);
  gl.uniform1f(u1.light, THEME.light);
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, sceneTex);
  gl.generateMipmap(gl.TEXTURE_2D);

  // pasada 2 -> pantalla, con efecto retro
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  gl.viewport(0, 0, W, H);
  draw(P2);
  const u2 = P2.u;
  gl.uniform1i(u2.scene, 0);
  gl.uniform2f(u2.res, W, H);
  gl.uniform1f(u2.fbo, FBO);
  gl.uniform1f(u2.ph, t / DURATION);
  gl.uniform1f(u2.frame, Math.floor(t * 30));
  gl.uniform3fv(u2.bg, THEME.bg);
  gl.uniform1f(u2.light, THEME.light);
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
}

window.DURATION = DURATION;
window.seek = t => { render(t); return true; };

document.fonts.load('bold 104px Arial').finally(() => {
  init();
  render(0);
  window.READY = true;
  if (!params.has('capture')) {
    const t0 = performance.now();
    (function loop(){ render(((performance.now() - t0) / 1000) % DURATION); requestAnimationFrame(loop); })();
  }
});
</script>
