<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Reel BF · cuadro de prueba</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Archivo+Black&family=IBM+Plex+Mono:wght@500;600&display=block" rel="stylesheet">
<style>
  :root{--black:#191919;--paper:#FFFCF1;--blue:#003AFE;--blue2:#0057FF;--red:#E3262B;--cell:49px}
  html,body{margin:0;background:#111}
  body{display:grid;place-items:center;min-height:100vh}
  #stage{width:1080px;height:1920px;position:relative;background:var(--black);overflow:hidden;font-family:Archivo,Arial,sans-serif;color:var(--paper)}
  body:not(.capture) #stage{transform:scale(calc(100vh / 1920px))}
  .layer{position:absolute;inset:0}
  #bg{display:block;width:100%;height:100%}

  /* Título fijo arriba (dentro de zona segura) */
  /* Título como el footer del artefacto: alineado a la izquierda + isotipo */
  .title{position:absolute;left:66px;top:206px;display:flex;flex-direction:column;align-items:flex-start;gap:22px}
  .title b{font-weight:900;font-stretch:125%;font-variation-settings:"wdth" 125;font-size:72px;line-height:1;letter-spacing:-.02em;color:var(--paper)}
  .title em{font-style:normal;color:var(--blue2)}
  .title svg{width:52px;height:auto;display:block}
  .title b{background:var(--black);padding:8px 16px 12px;margin-left:-16px}
  .title svg{background:var(--black);padding:10px 12px;margin-left:-12px;box-sizing:content-box}

  /* Recuadros con copies (estilo Boolean Sequence) */
  .box{position:absolute;background:var(--black);color:var(--paper);font-weight:500;font-size:31px;line-height:1.18;padding:18px 22px 20px;letter-spacing:-.005em}
  .tag{position:absolute;background:var(--blue);color:var(--paper);font-family:"IBM Plex Mono",monospace;font-weight:600;font-size:21px;letter-spacing:.02em;padding:9px 14px;line-height:1}
  .tag.k{background:var(--black);color:var(--paper)}
  .seg{position:absolute;display:flex;font-family:"IBM Plex Mono",monospace;font-weight:600;font-size:21px;letter-spacing:.06em}
  .seg i{font-style:normal;display:block;padding:.55em .75em;border:2px solid var(--blue2);margin-left:-2px;background:var(--black);color:var(--paper)}
  .seg i.on{background:var(--blue2);color:#fff}

  /* Sujeto */
  /* Marco del sujeto: corta el torso; la cabeza sale por arriba del marco */
  .panel{position:absolute;left:156px;top:700px;width:768px;height:540px;background:var(--black);
    background-image:radial-gradient(circle,rgba(255,252,241,.13) 1.4px,transparent 1.8px);background-size:24.5px 24.5px}
  .frame{position:absolute;left:156px;top:700px;width:768px;height:540px;pointer-events:none;
    border:2px solid rgba(255,252,241,.55);border-top-color:transparent}
  .panel::before{content:"";position:absolute;left:0;right:0;top:0;border-top:2px solid rgba(255,252,241,.55)}
  .frame i{position:absolute;width:12px;height:12px;background:var(--paper)}
  .frame i:nth-child(1){left:-7px;top:-7px}.frame i:nth-child(2){right:-7px;top:-7px}
  .frame i:nth-child(3){left:-7px;bottom:-7px}.frame i:nth-child(4){right:-7px;bottom:-7px}
  #sujeto{position:absolute;left:0;top:-89px;width:1080px}  /* cabeza en y≈440, mentón ≈1300 */

  /* Subtítulo: una palabra, posición fija */
  /* Subtítulo: una palabra, posición fija. 55 px = tamaño 55 de Premiere en secuencia 1080×1920 */
  .sub{position:absolute;left:0;right:0;top:1372px;text-align:center;font-family:"Archivo Black","Arial Black",Arial,sans-serif;font-size:55px;line-height:1;
    color:#fff;-webkit-text-stroke:8px var(--black);paint-order:stroke fill;text-shadow:0 4px 0 var(--black)}

  #grain{position:absolute;inset:0;width:100%;height:100%;mix-blend-mode:soft-light;opacity:.22;pointer-events:none}

  /* Guías de zona segura de Instagram Reels (solo con ?guias) */
  .guides{display:none;position:absolute;inset:0;pointer-events:none}
  .guias .guides{display:block}
  .guides div{position:absolute;background:rgba(227,38,43,.28);outline:2px dashed #E3262B}
  .guides b{position:absolute;font:600 22px "IBM Plex Mono",monospace;color:#fff;background:#E3262B;padding:4px 8px}
</style>
</head>
<body>
<div id="stage">
  <canvas id="bg" class="layer" width="1080" height="1920"></canvas>

  <!-- detrás del sujeto: asoman a los costados y se van por los bordes -->
  <div class="tag" style="left:-6px;top:600px;font-size:22px;padding:11px 16px">Rumor · BF</div>
  <div class="box" style="left:850px;top:700px;width:260px;font-size:40px;line-height:1.05;padding:22px 26px 24px">Solo<br>7 días.</div>

  <img id="sujeto" src="prueba/sujeto-completo.png" alt="">

  <!-- delante del sujeto: parte baja del cuadro, más grandes y sueltos -->
  <div class="tag" style="left:40px;top:1508px;font-size:22px;padding:11px 16px">¿Listo para pautar?</div>
  <div class="box" style="left:40px;top:1556px;width:560px;font-size:48px;line-height:1.08;padding:24px 28px 28px">15 checks.<br>5 etapas.<br>Menos de 2 minutos.</div>
  <div class="seg" style="right:-4px;top:1650px;font-size:30px"><i>+/−</i><i class="on">07 días</i><i>27/11</i></div>
  <div class="tag k" style="right:40px;top:1730px;font-size:22px;padding:11px 16px">Black Friday ready</div>

  <div class="title"><b>Black Friday <em>2026</em></b>
    <svg viewBox="0 0 119.52 144.65" aria-label="Rumor"><path fill="#FFFCF1" d="M119.2,141.6l-26.12-41.65c-.36-.56-.99-.9-1.660-.9h-31.2c-1.85,0-2.680-2.31-1.260-3.49l48.05-35.88c7.730-6.400,12.210-15.920,12.210-25.960h0C119.22,15.09,104.13,0,85.52,0H1.97C.88,0,0,.88,0,1.970v32.680c0,1.090.88,1.970,1.970,1.970h59.090c10.400,0,12.250,5.300,4.130,11.790l-30.310,24.180c-15.840,12.640-30.700,24.490-34.130,27.230-.47.370-.74.940-.74,1.540v41.160c0,1.670,1.950,2.580,3.230,1.520l45.930-40.100c.94-.78,2.350-.53,2.960.52l22.910,39.200c.35.610,1,.98,1.700.98h40.810c1.560,0,2.510-1.730,1.660-3.040Z"/></svg></div>
  <div class="sub" id="sub">campaña</div>

  <canvas id="grain" width="1080" height="1920"></canvas>

  <div class="guides">
    <div style="left:0;right:0;top:0;height:269px"></div><b style="left:12px;top:12px">zona UI superior</b>
    <div style="left:0;right:0;bottom:0;height:672px"></div><b style="left:12px;bottom:620px">zona UI inferior (descripción, usuario)</b>
    <div style="right:0;top:269px;width:120px;bottom:672px"></div><b style="right:4px;top:1190px">botones</b>
    <div style="left:0;top:269px;width:65px;bottom:672px"></div>
  </div>
</div>
<script src="../bf-fondo/grid.js"></script>
<script>
  const Q = new URLSearchParams(location.search);
  if (Q.has('capture')) document.body.classList.add('capture');
  if (Q.has('guias')) document.body.classList.add('guias');
  if (Q.has('fondo')) document.body.classList.add('con-fondo');
  const G = RumorGrid(document.getElementById('bg'), { modo: 'pleno' });

  // grano determinista (cambia a 12 pasos/seg como el fondo)
  const gc = document.getElementById('grain'), gx = gc.getContext('2d'), gimg = gx.createImageData(1080, 1920);
  function grain(step) {
    let s = (step * 2654435761) >>> 0;
    const d = gimg.data;
    for (let i = 0; i < d.length; i += 4) {
      s ^= s << 13; s >>>= 0; s ^= s >>> 17; s ^= s << 5; s >>>= 0;
      const v = 128 + ((s & 255) - 128) * 0.55;
      d[i] = d[i + 1] = d[i + 2] = v; d[i + 3] = 255;
    }
    gx.putImageData(gimg, 0, 0);
  }
  window.DURATION = 1;
  window.seek = t => {
    const lt = (t % G.CYCLE) / G.CYCLE, step = Math.floor(lt * G.STEPS);
    G.draw(step / G.STEPS, -1); grain(step);
  };
  window.seek(Number(Q.get('t') || 2));
</script>
</body>
</html>
