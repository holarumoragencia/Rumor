<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Reel BF · cuadro de prueba</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Archivo+Black&family=IBM+Plex+Mono:wght@500;600&display=block" rel="stylesheet">
<style>
  :root{--black:#191919;--paper:#FFFCF1;--blue:#003AFE;--blue2:#0057FF;--red:#E3262B;--cell:49px}
  html,body{margin:0;background:#111}
  body{display:grid;place-items:center;min-height:100vh}
  #stage{width:1080px;height:1920px;position:relative;background:var(--black);overflow:hidden;font-family:Archivo,Arial,sans-serif;color:var(--paper)}
  body:not(.capture) #stage{transform:scale(calc(100vh / 1920px))}
  .layer{position:absolute;inset:0}
  #bg{display:block;width:100%;height:100%}

  /* Título fijo arriba (dentro de zona segura) */
  .title{position:absolute;left:0;right:0;top:282px;text-align:center;font-weight:900;font-stretch:125%;font-variation-settings:"wdth" 125;
    font-size:64px;line-height:1;letter-spacing:-.02em;text-transform:uppercase}
  .title em{font-style:normal;color:var(--blue2)}
  .title span{background:var(--black);padding:10px 18px 12px}

  /* Recuadros con copies (estilo Boolean Sequence) */
  .box{position:absolute;background:var(--black);color:var(--paper);font-weight:500;font-size:31px;line-height:1.18;padding:18px 22px 20px;letter-spacing:-.005em}
  .tag{position:absolute;background:var(--blue);color:var(--paper);font-family:"IBM Plex Mono",monospace;font-weight:600;font-size:19px;letter-spacing:.14em;text-transform:uppercase;padding:9px 14px;line-height:1}
  .tag.k{background:var(--black);color:var(--paper)}
  .seg{position:absolute;display:flex;font-family:"IBM Plex Mono",monospace;font-weight:600;font-size:21px;letter-spacing:.06em}
  .seg i{font-style:normal;display:block;padding:12px 16px;border:2px solid var(--blue2);margin-left:-2px;background:var(--black);color:var(--paper)}
  .seg i.on{background:var(--blue2);color:#fff}

  /* Sujeto */
  #sujeto{position:absolute;left:156px;top:44px;width:768px;filter:drop-shadow(0 0 34px rgba(0,87,255,.55)) drop-shadow(0 0 2px rgba(0,87,255,.6))}

  /* Subtítulo: una palabra, posición fija */
  .sub{position:absolute;left:0;right:0;top:1112px;text-align:center;font-family:"Archivo Black","Arial Black",Arial,sans-serif;font-size:96px;line-height:1;
    text-transform:uppercase;color:#fff;letter-spacing:-.01em;-webkit-text-stroke:14px var(--black);paint-order:stroke fill;text-shadow:0 6px 0 var(--black)}

  #grain{position:absolute;inset:0;width:100%;height:100%;mix-blend-mode:soft-light;opacity:.22;pointer-events:none}

  /* Guías de zona segura de Instagram Reels (solo con ?guias) */
  .guides{display:none;position:absolute;inset:0;pointer-events:none}
  .guias .guides{display:block}
  .guides div{position:absolute;background:rgba(227,38,43,.28);outline:2px dashed #E3262B}
  .guides b{position:absolute;font:600 22px "IBM Plex Mono",monospace;color:#fff;background:#E3262B;padding:4px 8px}
</style>
</head>
<body>
<div id="stage">
  <canvas id="bg" class="layer" width="1080" height="1920"></canvas>

  <!-- detrás del sujeto (asoman por los costados) -->
  <div class="tag" style="left:66px;top:478px">Checklist · Rumor</div>
  <div class="box" style="left:66px;top:520px;width:250px;font-size:28px">Solo 7 días para estar listo.</div>
  <div class="seg" style="left:770px;top:540px"><i>+/−</i><i class="on">27/11</i></div>
  <div class="tag k" style="left:770px;top:604px">7 días</div>

  <img id="sujeto" src="prueba/sujeto.png" alt="">

  <!-- delante del sujeto (sobre el torso) -->
  <div class="tag" style="left:66px;top:948px">¿Listo para pautar?</div>
  <div class="box" style="left:66px;top:988px;width:330px;font-size:26px">15 checks. 5 etapas.<br>Menos de 2 minutos.</div>

  <div class="title"><span>Black Friday <em>2026</em></span></div>
  <div class="sub" id="sub">Campaña</div>

  <canvas id="grain" width="1080" height="1920"></canvas>

  <div class="guides">
    <div style="left:0;right:0;top:0;height:269px"></div><b style="left:12px;top:12px">zona UI superior</b>
    <div style="left:0;right:0;bottom:0;height:672px"></div><b style="left:12px;bottom:620px">zona UI inferior (descripción, usuario)</b>
    <div style="right:0;top:269px;width:120px;bottom:672px"></div><b style="right:4px;top:1190px">botones</b>
    <div style="left:0;top:269px;width:65px;bottom:672px"></div>
  </div>
</div>
<script src="../bf-fondo/grid.js"></script>
<script>
  const Q = new URLSearchParams(location.search);
  if (Q.has('capture')) document.body.classList.add('capture');
  if (Q.has('guias')) document.body.classList.add('guias');
  const G = RumorGrid(document.getElementById('bg'), { modo: 'pleno' });

  // grano determinista (cambia a 12 pasos/seg como el fondo)
  const gc = document.getElementById('grain'), gx = gc.getContext('2d'), gimg = gx.createImageData(1080, 1920);
  function grain(step) {
    let s = (step * 2654435761) >>> 0;
    const d = gimg.data;
    for (let i = 0; i < d.length; i += 4) {
      s ^= s << 13; s >>>= 0; s ^= s >>> 17; s ^= s << 5; s >>>= 0;
      const v = 128 + ((s & 255) - 128) * 0.55;
      d[i] = d[i + 1] = d[i + 2] = v; d[i + 3] = 255;
    }
    gx.putImageData(gimg, 0, 0);
  }
  window.DURATION = 1;
  window.seek = t => {
    const lt = (t % G.CYCLE) / G.CYCLE, step = Math.floor(lt * G.STEPS);
    G.draw(step / G.STEPS, -1); grain(step);
  };
  window.seek(Number(Q.get('t') || 2));
</script>
</body>
</html>
