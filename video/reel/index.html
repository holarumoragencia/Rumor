<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Reel Black Friday · Rumor</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Archivo+Black&family=IBM+Plex+Mono:wght@500;600&display=block" rel="stylesheet">
<style>
  :root{--black:#191919;--paper:#FFFCF1;--blue:#003AFE;--blue2:#0057FF;--red:#E3262B}
  html,body{margin:0;background:#111}
  body{display:grid;place-items:center;min-height:100vh}
  #stage{width:1080px;height:1920px;position:relative;background:var(--black);overflow:hidden;font-family:Archivo,Arial,sans-serif;color:var(--paper)}
  body:not(.capture) #stage{transform:scale(calc(100vh / 1920px))}
  #bg{position:absolute;inset:0;display:block;width:100%;height:100%}
  .seg{position:absolute;inset:0}

  /* Recuadros (estilo Boolean Sequence) */
  .lb{position:absolute;white-space:pre-line;will-change:clip-path}
  .box{background:var(--black);color:var(--paper);font-weight:500;line-height:1.08;padding:24px 28px 28px;letter-spacing:-.005em}
  .tag{background:var(--blue);color:var(--paper);font-family:"IBM Plex Mono",monospace;font-weight:600;font-size:22px;letter-spacing:.02em;padding:11px 16px;line-height:1}
  .tag.k{background:var(--black)}
  .sg{display:flex;font-family:"IBM Plex Mono",monospace;font-weight:600;font-size:30px;letter-spacing:.04em}
  .sg i{font-style:normal;display:block;padding:.55em .75em;border:2px solid var(--blue2);margin-left:-2px;background:var(--black);color:var(--paper);white-space:nowrap}
  .sg i.on{background:var(--blue2);color:#fff}

  #sujeto{position:absolute;left:0;top:-89px;width:1080px}

  /* Título fijo (como el footer del artefacto) */
  .title{position:absolute;left:66px;top:206px;display:flex;flex-direction:column;align-items:flex-start;gap:22px}
  .title b{font-weight:900;font-stretch:125%;font-variation-settings:"wdth" 125;font-size:72px;line-height:1;letter-spacing:-.02em;color:var(--paper);
    background:var(--black);padding:8px 16px 12px;margin-left:-16px;white-space:pre}
  .title em{font-style:normal;color:var(--blue2)}
  .title svg{width:52px;height:auto;display:block;background:var(--black);padding:10px 12px;margin-left:-12px;box-sizing:content-box}

  /* Subtítulo: una palabra, posición fija entre barbilla y cuello. 55 px = tamaño 55 de Premiere */
  .sub{position:absolute;left:0;right:0;top:1372px;text-align:center;font-family:"Archivo Black","Arial Black",Arial,sans-serif;font-size:55px;line-height:1;
    color:#fff;-webkit-text-stroke:8px var(--black);paint-order:stroke fill;text-shadow:0 4px 0 var(--black);transform-origin:50% 60%}

  #grain{position:absolute;inset:0;width:100%;height:100%;mix-blend-mode:soft-light;opacity:.22;pointer-events:none}

  /* ---------- Tramo del artefacto ---------- */
  #win{position:absolute;left:0;top:0;width:1080px;height:1920px;overflow:hidden;background:var(--black);visibility:hidden}
  #art{position:absolute;left:0;top:0;width:390px;height:1400px;border:0;transform-origin:0 0;background:var(--black)}
  #frame{position:absolute;pointer-events:none;border:2px solid rgba(255,252,241,.6);display:none}
  #frame i{position:absolute;width:14px;height:14px;background:var(--paper)}
  #frame i:nth-child(1){left:-8px;top:-8px}#frame i:nth-child(2){right:-8px;top:-8px}
  #frame i:nth-child(3){left:-8px;bottom:-8px}#frame i:nth-child(4){right:-8px;bottom:-8px}
  #frameTag{position:absolute;display:none}
  /* toque (dedo) */
  .touch{position:absolute;width:84px;height:84px;margin:-42px 0 0 -42px;border-radius:50%;pointer-events:none;display:none;
    background:rgba(255,252,241,.22);border:2px solid rgba(255,252,241,.85);box-shadow:0 6px 18px rgba(0,0,0,.25)}
  .ripple{position:absolute;width:84px;height:84px;margin:-42px 0 0 -42px;border-radius:50%;border:2px solid var(--paper);pointer-events:none;display:none}
  /* marcas de "pendiente" sobre los checks sin marcar */
  .mark{position:absolute;pointer-events:none;display:none}
  .mark b{position:absolute;width:26px;height:26px;border:4px solid var(--blue2)}
  .mark b:nth-child(1){left:-10px;top:-10px;border-right:0;border-bottom:0}.mark b:nth-child(2){right:-10px;top:-10px;border-left:0;border-bottom:0}
  .mark b:nth-child(3){left:-10px;bottom:-10px;border-right:0;border-top:0}.mark b:nth-child(4){right:-10px;bottom:-10px;border-left:0;border-top:0}

  /* ---------- Cierre ---------- */
  #outro{position:absolute;inset:0;display:none}
  #dim{position:absolute;inset:0;background:var(--black)}
  #rc{position:absolute;inset:0;width:100%;height:100%}
  .imago{position:absolute;left:110px;top:750px;width:860px;height:auto}
  #imagoR{clip-path:inset(0 0 48% 0)}
  #outTag{position:absolute;left:0;right:0;top:1218px;text-align:center}
  #outTag span{font-family:"IBM Plex Mono",monospace;font-weight:600;font-size:30px;letter-spacing:.02em;color:var(--paper);background:var(--blue);padding:12px 20px;display:inline-block;white-space:pre}
</style>
</head>
<body>
<div id="stage">
  <canvas id="bg" width="1080" height="1920"></canvas>
  <div class="seg" id="back"></div>
  <img id="sujeto" alt="">
  <div class="seg" id="front"></div>
  <div id="win"><iframe id="art" scrolling="no"></iframe></div>
  <div id="frame"><i></i><i></i><i></i><i></i></div>
  <div id="frameTag" class="tag"></div>
  <div class="mark" id="mk1"><b></b><b></b><b></b><b></b></div>
  <div class="mark" id="mk2"><b></b><b></b><b></b><b></b></div>
  <div class="ripple" id="ripple"></div>
  <div class="touch" id="touch"></div>
  <div id="outro">
    <div id="dim"></div>
    <canvas id="rc" width="1080" height="1920"></canvas>
    <svg id="isoPath" style="display:none" viewBox="0 0 119.52 144.65"><path d="M119.2,141.6l-26.12-41.65c-.36-.56-.99-.9-1.66-.9h-31.2c-1.850,0-2.68-2.31-1.26-3.49l48.05-35.88c7.73-6.4,12.21-15.92,12.21-25.96h0C119.22,15.09,104.13,0,85.52,0H1.97C.88,0,0,.88,0,1.97v32.68c0,1.09.88,1.97,1.97,1.97h59.09c10.4,0,12.25,5.3,4.13,11.79l-30.31,24.18c-15.84,12.64-30.7,24.49-34.13,27.23-.47.37-.74.94-.74,1.54v41.16c0,1.67,1.95,2.58,3.23,1.52l45.93-40.1c.94-.78,2.35-.53,2.96.52l22.91,39.2c.35.61,1,.98,1.7.98h40.81c1.56,0,2.51-1.73,1.66-3.04Z"/></svg>
    <img class="imago" id="imagoR" src="../assets/imagotipo-blanco.svg" alt="">
    <img class="imago" id="imagoW" src="../assets/imagotipo-blanco.svg" alt="rumor">
    <div id="outTag"><span id="outTagTxt"></span></div>
  </div>
  <div class="title" id="title"><b id="titleTxt"></b>
    <svg viewBox="0 0 119.52 144.65" aria-label="Rumor"><path fill="#FFFCF1" d="M119.2,141.6l-26.12-41.65c-.36-.56-.99-.9-1.66-.9h-31.2c-1.85,0-2.68-2.31-1.26-3.49l48.05-35.88c7.73-6.4,12.21-15.92,12.21-25.96h0C119.22,15.09,104.13,0,85.52,0H1.97C.88,0,0,.88,0,1.97v32.68c0,1.09.88,1.97,1.97,1.97h59.09c10.4,0,12.25,5.3,4.13,11.79l-30.31,24.18c-15.84,12.64-30.7,24.49-34.13,27.23-.47.37-.74.94-.74,1.54v41.16c0,1.67,1.95,2.58,3.23,1.52l45.93-40.1c.94-.78,2.35-.53,2.96.52l22.91,39.2c.35.61,1,.98,1.7.98h40.81c1.56,0,2.51-1.73,1.66-3.04Z"/></svg></div>
  <div class="sub" id="sub"></div>
  <canvas id="grain" width="1080" height="1920"></canvas>
</div>
<script src="../bf-fondo/grid.js"></script>
<script src="subs.js"></script>
<script src="artefacto.js"></script>
<script>
/* ===================== LÍNEA DE TIEMPO =====================
   Tiempos globales del reel (s). El fondo corre continuo de punta a punta.
   p1  : sujeto, primera_parte.mp4 completo
   vo  : voz en off (audio 0,90 → 21,75 s) + artefacto  [pendiente]
   fin : sujeto, final.mp4 completo
   out : cierre con logo                               [pendiente]            */
const FPS = 30;
const SEGS = [
  { id: 'p1',  start: 0,     dur: 10.85, frames: 'media/p1/',  n: 323 },
  { id: 'vo',  start: 10.85, dur: 20.85, audioIn: 0.90 },
  { id: 'fin', start: 31.70, dur: 5.45,  frames: 'media/fin/', n: 163 },
  { id: 'out', start: 37.15, dur: 3.5 },
];

/* Recuadros: [segmento, entra, sale, capa, tipo, posición, texto]
   tipo: tag | tag k | box | sg (segmentado: celdas separadas por "|", la que empieza con * va prendida) */
const L = [
  // p1 · "Solo 7 días para el comienzo de Black Friday"
  ['p1', 0.30, 3.20, 'back',  'box',   'left:850px;top:700px;width:260px;font-size:40px', 'Solo\n7 días.'],
  ['p1', 0.55, 3.20, 'front', 'sg',    'right:-4px;top:1650px', '+/−|*07 días|27/11'],
  ['p1', 0.80, 3.20, 'front', 'tag k', 'right:40px;top:1730px', 'Black Friday · viernes 27'],
  // p1 · "Y en Rumor preparamos un checklist especial"
  ['p1', 3.30, 6.30, 'back',  'tag',   'left:-6px;top:640px', 'by Rumor'],
  ['p1', 3.45, 6.30, 'front', 'tag',   'left:40px;top:1508px', 'Checklist especial'],
  ['p1', 3.60, 6.30, 'front', 'box',   'left:40px;top:1556px;width:600px;font-size:48px', 'Hecho por Rumor\npara este\nBlack Friday.'],
  // p1 · "para que puedas saber si ya estás listo para comenzar la campaña. Vení que te muestro."
  ['p1', 6.40, 10.85, 'front', 'tag',  'left:40px;top:1508px', '¿Listo para pautar?'],
  ['p1', 6.55, 10.85, 'front', 'box',  'left:40px;top:1556px;width:600px;font-size:48px', 'Sabelo antes\nde lanzar\nla campaña.'],
  ['p1', 7.20, 10.85, 'front', 'sg',   'right:-4px;top:1650px', '*+ listo|− pendiente'],
  ['p1', 9.55, 10.85, 'back',  'box',  'left:850px;top:700px;width:260px;font-size:40px', 'Vení,\nte muestro.'],
  // fin · "Si querés usar esta herramienta gratuita..."
  ['fin', 0.55, 3.45, 'back',  'box',  'left:850px;top:700px;width:260px;font-size:40px', 'Gratis.'],
  ['fin', 0.70, 3.45, 'front', 'tag',  'left:40px;top:1508px', 'Herramienta gratuita'],
  ['fin', 0.85, 3.45, 'front', 'box',  'left:40px;top:1556px;width:600px;font-size:48px', '15 checks para\nsalir a pautar\ntranquilo.'],
  // fin · "...comentá Black y te la enviamos por privado"
  ['fin', 2.70, 5.45, 'front', 'sg',   'right:-4px;top:1650px', 'comentá|*Black'],
  ['fin', 3.55, 5.45, 'front', 'tag',  'left:40px;top:1508px', 'Te lo enviamos por DM'],
  ['fin', 3.65, 5.45, 'front', 'box',  'left:40px;top:1556px;font-size:110px;line-height:1;padding:22px 34px 30px', 'Black'],
];

/* ===================== MOTOR ===================== */
const Q = new URLSearchParams(location.search);
if (Q.has('capture')) document.body.classList.add('capture');
const G = RumorGrid(document.getElementById('bg'), { modo: 'pleno' });
const segById = Object.fromEntries(SEGS.map(s => [s.id, s]));
const ONLY = Q.get('seg');                       // ?seg=p1 renderiza solo ese tramo
const T0 = ONLY ? segById[ONLY].start : 0;
window.DURATION = ONLY ? segById[ONLY].dur : SEGS.reduce((a, s) => Math.max(a, s.start + s.dur), 0);

function hash(a, b) { let h = Math.imul(a ^ 0x9e3779b9, 0x85ebca6b) ^ Math.imul(b, 0xc2b2ae35); h ^= h >>> 13; h = Math.imul(h, 0x27d4eb2f); return ((h ^ (h >>> 16)) >>> 0) / 4294967296; }
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const ease = x => 1 - Math.pow(1 - clamp(x), 3);
const GLYPHS = '+−%/01<>';

// Texto que se "decodifica": cada letra aparece tras unos signos al azar
function scramble(txt, p, seed, step) {
  let out = '';
  for (let i = 0; i < txt.length; i++) {
    const c = txt[i];
    if (c === ' ' || c === '\n') { out += c; continue; }
    const at = (i / Math.max(1, txt.length)) * 0.75;
    out += p >= at + 0.25 ? c : p >= at ? GLYPHS[Math.floor(hash(seed * 131 + i, step) * GLYPHS.length)] : ' ';
  }
  return out;
}

// Construir recuadros
const labels = L.map(([seg, tin, tout, layer, kind, pos, text], k) => {
  const el = document.createElement('div');
  el.className = 'lb ' + (kind === 'sg' ? 'sg' : kind);
  el.style.cssText += pos;
  let cells = null;
  if (kind === 'sg') {
    cells = text.split('|').map(c => { const i = document.createElement('i'); const on = c.startsWith('*'); if (on) i.className = 'on'; i.dataset.t = on ? c.slice(1) : c; el.appendChild(i); return i; });
  }
  document.getElementById(layer).appendChild(el);
  return { seg, tin, tout, el, text, cells, k };
});

const IN = 0.32, OUT = 0.2;
function drawLabels(seg, lt, step) {
  for (const b of labels) {
    const vis = b.seg === seg && lt >= b.tin && lt < b.tout;
    b.el.style.display = vis ? '' : 'none';
    if (!vis) continue;
    const pin = ease((lt - b.tin) / IN), pout = clamp((b.tout - lt) / OUT);
    // entra barriendo de izquierda a derecha; sale barriendo hacia la izquierda
    const w = pin < 1 ? (1 - pin) * 100 : (1 - pout) * 100;
    b.el.style.clipPath = pin < 1 ? `inset(0 ${w}% 0 0)` : pout < 1 ? `inset(0 0 0 ${w}%)` : 'none';
    const ps = clamp((lt - b.tin) / 0.7);
    if (b.cells) b.cells.forEach((c, i) => c.textContent = scramble(c.dataset.t, clamp(ps * 1.2 - i * 0.12), b.k * 7 + i, step));
    else b.el.textContent = scramble(b.text, ps, b.k, step);
  }
}

// Subtítulos
const subEl = document.getElementById('sub');
function drawSub(seg, lt) {
  const s = segById[seg];
  const list = (window.SUBS[seg] || []).map(([a, b, w]) => seg === 'vo' ? [a - s.audioIn, b - s.audioIn, w] : [a, b, w]);
  let cur = null;
  for (let i = 0; i < list.length; i++) {
    const [a, b, w] = list[i], next = list[i + 1];
    const until = next && next[0] - b < 0.35 ? next[0] : b + 0.18;   // sostiene hasta la próxima si la pausa es corta
    if (lt >= a && lt < until) { cur = [a, w]; break; }
  }
  subEl.textContent = cur ? cur[1] : '';
  const k = cur ? clamp((lt - cur[0]) / 0.09) : 1;
  subEl.style.transform = `scale(${1.08 - 0.08 * ease(k)})`;
}

// Título
const titleTxt = document.getElementById('titleTxt'), titleEl = document.getElementById('title');
function drawTitle(t, step) {
  const p = clamp((t - 0.05) / 0.6);
  const s = scramble('Black Friday 2026', p, 99, step);
  titleTxt.innerHTML = s.slice(0, 13) + '<em>' + s.slice(13) + '</em>';
  titleEl.style.clipPath = `inset(0 ${(1 - ease(t / 0.3)) * 100}% 0 0)`;
}

// Sujeto
const img = document.getElementById('sujeto');
async function drawSubject(seg, lt) {
  let s = segById[seg], f;
  if (seg === 'vo' && lt < 0.6) { s = segById.p1; f = s.n; }                       // fundido de entrada
  else if (seg === 'vo' && lt > segById.vo.dur - 0.55) { s = segById.fin; f = 1; } // fundido de salida
  if (!s.frames) { img.style.display = 'none'; return; }
  img.style.display = '';
  if (!f) f = Math.min(s.n, Math.floor(lt * FPS) + 1);
  const src = s.frames + 'f' + String(f).padStart(5, '0') + '.png';
  if (img.getAttribute('src') !== src) { img.src = src; try { await img.decode(); } catch (e) {} }
}

// Grano
const gc = document.getElementById('grain'), gx = gc.getContext('2d'), gimg = gx.createImageData(1080, 1920);
function grain(step) {
  let s = (step * 2654435761) >>> 0 || 1; const d = gimg.data;
  for (let i = 0; i < d.length; i += 4) { s ^= s << 13; s >>>= 0; s ^= s >>> 17; s ^= s << 5; s >>>= 0; d[i] = d[i + 1] = d[i + 2] = 128 + ((s & 255) - 128) * 0.55; d[i + 3] = 255; }
  gx.putImageData(gimg, 0, 0);
}

/* ===================== TRAMO DEL ARTEFACTO (voz en off) =====================
   Tiempos locales del tramo (0 = arranque de la voz en off recortada). Voz:
   0,24 "son 15 puntos" · 1,49 "en 5 etapas" · 2,59 "que las vas a hacer en menos de 2 minutos"
   4,68 "el destino" · 5,86 "la medición" · 7,21 "la oferta" · 8,44 "la respuesta" · 9,95 "y el presupuesto"
   11,61 "marcás lo que ya resolviste" · 13,38 "lo que queda en blanco es tu tarea pendiente para esta semana"
   17,76 "y al final te dice si estás listo" · 20,13 "o todavía no"                                         */
const PRE = 4000;   // ms de reloj del artefacto antes del tramo (su fondo ya pasó el arranque)
const TAPS = [[11.70, 's0i0'], [12.25, 's0i1'], [12.80, 's0i2'], [14.35, 's1i0']];
const go = i => w => w.eval(`goTo(${i})`);   // goTo es una constante del script del artefacto
const EV = [
  [5.80, go(1)], [7.15, go(2)], [8.38, go(3)], [9.88, go(4)],
  [10.80, go(0)],
  ...TAPS.map(([t, id]) => [t, (w, d) => d.querySelector(`[data-id="${id}"]`).click()]),
  // al completar la etapa 01 el artefacto pasa solo a la 02 (0,9 s después)
  [17.15, go(5)],
];
/* Cámara: [entra, duración del movimiento, foco, zoom]. Foco = selector + ancla (0..1) o {x,y} en px del artefacto */
const CAM = [
  [0.00, 0.01, { x: 195, y: 346 }, 1.00],                    // la página completa
  [0.45, 1.00, { x: 132, y: 390 }, 1.55],                    // "15 puntos": el contador
  [1.45, 0.90, { x: 195, y: 512 }, 1.30],                    // "5 etapas": la tira de etapas
  [2.50, 1.10, { x: 195, y: 420 }, 1.00],                    // "menos de 2 minutos"
  [4.30, 1.00, { x: 195, y: 700 }, 1.10],                    // las 5 etapas
  [5.30, 5.30, { x: 195, y: 720 }, 1.18],                    // empuje lento mientras cambian
  [10.70, 0.90, { x: 195, y: 1000 }, 1.30],                  // checks de la 01
  [12.95, 0.70, { x: 195, y: 820 }, 1.05],                   // etapa completa: READY
  [13.85, 0.80, { x: 195, y: 1040 }, 1.30],                  // 02: lo que queda en blanco
  [17.10, 0.90, { x: 195, y: 820 }, 1.10],                   // resultado
  [19.85, 0.80, { sel: '#verdict', ax: .5, ay: .5 }, 1.45],  // "o todavía no"
];
const WIN = { x: 0, y: 0, w: 1080, h: 1920 }, AW = 390, AH = 1400, S0 = WIN.w / AW;
const winEl = document.getElementById('win'), art = document.getElementById('art'), frameEl = document.getElementById('frame');
const touchEl = document.getElementById('touch'), rippleEl = document.getElementById('ripple');
let A = null;   // estado del artefacto: { w, d, lt, ev, starts }

function loadArt() {
  return new Promise(res => {
    art.onload = () => {
      const w = art.contentWindow, d = art.contentDocument;
      (d.fonts ? d.fonts.ready : Promise.resolve()).then(() => {
        A = { w, d, lt: -1, ev: 0, starts: new Map() };
        w.__vt.hook = vt => syncAnims(vt);
        w.__vt.advanceTo(PRE); syncAnims(PRE);
        res();
      });
    };
    art.srcdoc = window.ARTEFACTO_HTML;
  });
}
// Las transiciones CSS del artefacto se pausan y se ubican en el tiempo exacto de cada cuadro
function syncAnims(vt) {
  A.d.body.offsetHeight;
  for (const an of A.d.getAnimations()) {
    if (!A.starts.has(an)) { A.starts.set(an, vt); an.pause(); }
    const ct = vt - A.starts.get(an), end = an.effect.getComputedTiming().endTime;
    if (ct >= end) an.finish(); else an.currentTime = Math.max(0, ct);
  }
}
async function artTo(lt) {
  if (!A || lt < A.lt) await loadArt();          // ir hacia atrás: se recarga y se repite desde cero
  while (A.ev < EV.length && EV[A.ev][0] <= lt) {
    const [te, fn] = EV[A.ev++];
    A.w.__vt.advanceTo(PRE + te * 1000); syncAnims(PRE + te * 1000);
    fn(A.w, A.d); syncAnims(PRE + te * 1000);
  }
  A.w.__vt.advanceTo(PRE + lt * 1000); syncAnims(PRE + lt * 1000);
  A.lt = lt;
}
function focusOf(f) {
  if (!f.sel) return { x: f.x, y: f.y };
  const r = A.d.querySelector(f.sel).getBoundingClientRect();
  return { x: r.left + r.width * f.ax, y: r.top + r.height * f.ay };
}
function camAt(lt) {
  let c = { ...focusOf(CAM[0][2]), z: CAM[0][3] };
  for (const [t, dur, f, z] of CAM) {
    if (lt < t) break;
    const tg = focusOf(f), io = 0.5 - 0.5 * Math.cos(Math.PI * clamp((lt - t) / dur));   // seno entrada/salida
    c = { x: c.x + (tg.x - c.x) * io, y: c.y + (tg.y - c.y) * io, z: c.z + (z - c.z) * io };
  }
  c.z *= 1 + 0.008 * Math.sin(lt * 0.7);      // respiración leve de cámara
  const S = S0 * c.z, hw = WIN.w / 2 / S, hh = WIN.h / 2 / S;
  c.x = clamp(c.x, hw, AW - hw); c.y = clamp(c.y, hh, AH - hh);
  return { S, tx: WIN.w / 2 - c.x * S, ty: WIN.h / 2 - c.y * S };
}
const toReel = (cam, x, y) => ({ x: WIN.x + cam.tx + x * cam.S, y: WIN.y + cam.ty + y * cam.S });

async function drawArt(seg, lt) {
  const on = seg === 'vo';
  winEl.style.visibility = on ? 'visible' : 'hidden'; frameEl.style.display = 'none';
  touchEl.style.display = rippleEl.style.display = 'none';
  ['mk1', 'mk2'].forEach(id => document.getElementById(id).style.display = 'none');
  if (!on) return;
  await artTo(lt);
  const cam = camAt(lt);
  art.style.transform = `translate(${cam.tx}px,${cam.ty}px) scale(${cam.S})`;

  // Entrada y salida: fundido suave desde/hacia el sujeto, con una leve escala y desenfoque
  const dur = segById.vo.dur;
  const fin = ease(lt / 0.6), fout = ease((dur - lt) / 0.55), f = Math.min(fin, fout);
  winEl.style.opacity = f;
  winEl.style.transform = `scale(${1 + 0.05 * (1 - f)})`;
  winEl.style.filter = f < 1 ? `blur(${(1 - f) * 10}px)` : 'none';
  frameEl.style.display = 'none';

  // Toques: el círculo llega, presiona y deja una onda
  for (const [tt, id] of TAPS) {
    if (lt < tt - 0.32 || lt > tt + 0.4) continue;
    const r = A.d.querySelector(`[data-id="${id}"] .sw`).getBoundingClientRect();
    const p = toReel(cam, r.left + r.width / 2, r.top + r.height / 2);
    const k = (lt - tt);
    touchEl.style.display = 'block';
    Object.assign(touchEl.style, { left: p.x + 'px', top: p.y + 'px',
      opacity: k < 0 ? ease((k + 0.32) / 0.15) : 1 - ease((k - 0.15) / 0.25),
      transform: `scale(${k < -0.08 ? 1.15 - 0.15 * ease((k + 0.32) / 0.24) : k < 0.08 ? 0.82 : 0.82 + 0.18 * ease((k - 0.08) / 0.15)})` });
    if (k > 0) { rippleEl.style.display = 'block'; Object.assign(rippleEl.style, { left: p.x + 'px', top: p.y + 'px', opacity: 1 - ease(k / 0.4), transform: `scale(${1 + 1.4 * ease(k / 0.4)})` }); }
  }
  // "Lo que queda en blanco": esquinas que marcan los checks pendientes de la 02
  if (lt > 14.9 && lt < 17.05) {
    ['s1i1', 's1i2'].forEach((id, i) => {
      const tin = 14.9 + i * 0.25; if (lt < tin) return;
      const r = A.d.querySelector(`[data-id="${id}"]`).getBoundingClientRect();
      const a = toReel(cam, r.left, r.top), b = toReel(cam, r.right, r.bottom), m = document.getElementById('mk' + (i + 1));
      const pin = ease((lt - tin) / 0.35), blink = 1;
      Object.assign(m.style, { display: 'block', left: a.x - 6 + 'px', top: a.y - 6 + 'px', width: b.x - a.x + 12 + 'px', height: b.y - a.y + 12 + 'px',
        opacity: pin * (lt > 16.85 ? 1 - ease((lt - 16.85) / 0.2) : blink), transform: `scale(${1.12 - 0.12 * pin})` });
    });
  }
}

/* ===================== CIERRE: el isotipo se arma con las celdas de la grilla ===================== */
const outroEl = document.getElementById('outro'), dimEl = document.getElementById('dim'), rc = document.getElementById('rc'), rx = rc.getContext('2d');
const imagoR = document.getElementById('imagoR'), imagoW = document.getElementById('imagoW'), outTagTxt = document.getElementById('outTagTxt');
/* Geometría del imagotipo (viewBox 444,59 × 200,05) a 860 px: la R ocupa x 187,3–257,1 y 0–84 */
const IMG = { x: 110, y: 750, k: 860 / 444.59 };
const RBOX = { x: IMG.x + 187.3 * IMG.k, y: IMG.y, w: 69.8 * IMG.k };
const RC_CELL = 15;
const RCELLS = (() => {
  const P = new Path2D(document.querySelector('#isoPath path').getAttribute('d')), k = RBOX.w / 119.52, out = [];
  const m = document.createElement('canvas').getContext('2d');
  for (let j = -1; j * RC_CELL < 144.65 * k + RC_CELL; j++) for (let i = -1; i * RC_CELL < RBOX.w + RC_CELL; i++) {
    const cx = (i + .5) * RC_CELL, cy = (j + .5) * RC_CELL;
    if (m.isPointInPath(P, cx / k, cy / k)) out.push({ x: RBOX.x + i * RC_CELL, y: RBOX.y + j * RC_CELL, at: 0.3 + hash(i * 7 + 1, j * 13 + 5) * 0.8 });
  }
  return out;
})();
function plus(x, y, s, col) { const t = Math.max(2, s * 0.14), L = s * 0.5; rx.fillStyle = col; rx.fillRect(x + s / 2 - L / 2, y + s / 2 - t / 2, L, t); rx.fillRect(x + s / 2 - t / 2, y + s / 2 - L / 2, t, L); }
function drawOutro(seg, lt, step) {
  const on = seg === 'out';
  outroEl.style.display = on ? 'block' : 'none';
  if (!on) return;
  dimEl.style.opacity = 0.86 * ease(lt / 0.6);
  rx.clearRect(0, 0, 1080, 1920);
  const solid = ease((lt - 1.25) / 0.4);
  for (const c of RCELLS) {
    if (lt < c.at) continue;
    const flick = lt - c.at < 0.14 && hash(c.x * 3 + c.y, step) < 0.5;
    rx.globalAlpha = (flick ? 0.35 : 1) * (1 - solid);
    rx.fillStyle = '#0057FF'; rx.fillRect(c.x, c.y, RC_CELL, RC_CELL);
    plus(c.x, c.y, RC_CELL, '#FFFCF1');
  }
  rx.globalAlpha = 1;
  imagoR.style.opacity = solid;
  const pw = ease((lt - 1.55) / 0.5);
  imagoW.style.clipPath = `inset(52% ${(1 - pw) * 100}% 0 0)`;
  imagoW.style.opacity = pw > 0 ? 1 : 0;
  outTagTxt.textContent = lt > 2.05 ? scramble('@rumor.agencia', clamp((lt - 2.05) / 0.6), 77, step) : '';
  outTagTxt.parentElement.style.opacity = lt > 2.05 ? 1 : 0;
}

window.READY = loadArt();
window.seek = async (tl) => {
  await window.READY;
  const t = T0 + tl;
  const seg = SEGS.find(s => t >= s.start && t < s.start + s.dur) || SEGS[SEGS.length - 1];
  const lt = t - seg.start;
  const step = Math.floor(t * 12);                         // el fondo y los signos cambian 12 veces por segundo
  G.draw(Math.floor(((t % G.CYCLE) / G.CYCLE) * G.STEPS) / G.STEPS, -1);
  grain(Math.floor(t * FPS));
  drawLabels(seg.id, lt, step);
  drawSub(seg.id, lt);
  const showTitle = seg.id === 'p1' || seg.id === 'fin';
  titleEl.style.display = showTitle ? '' : 'none';
  if (showTitle) drawTitle(lt, step);
  await drawArt(seg.id, lt);
  drawOutro(seg.id, lt, step);
  await drawSubject(seg.id, lt);
};

if (!Q.has('capture')) {
  const t0 = performance.now();
  (async function loop() { await window.seek(((performance.now() - t0) / 1000) % window.DURATION); requestAnimationFrame(loop); })();
}
</script>
