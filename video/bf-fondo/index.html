<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Fondo Black Friday</title>
<style>
  html,body{margin:0;background:#111}
  body{display:grid;place-items:center;min-height:100vh}
  #stage{width:1080px;height:1920px;position:relative;background:#191919;overflow:hidden}
  #stage canvas{display:block;width:100%;height:100%}
  body:not(.capture) #stage{transform:scale(calc(100vh / 1920px));transform-origin:center}
  @media (max-aspect-ratio:9/16){body:not(.capture) #stage{transform:scale(calc(100vw / 1080px))}}
</style>
</head>
<body>
<div id="stage"><canvas width="1080" height="1920"></canvas></div>
<script src="grid.js"></script>
<script>
/* Fondo animado del hero de la Checklist Black Friday (grilla booleana Rumor),
   adaptado a 1080×1920 para reel. Misma lógica, temas y bucle de 12 s que el artefacto.
   Parámetros de URL:
     ?modo=pleno   manchas en todo el cuadro (default)
     ?modo=centro  centro más oscuro, para poner encima al sujeto o al artefacto
     ?intro=1      agrega el arranque "cargando" de 1,4 s antes del bucle
     ?capture      sin escalado (lo usa render.cjs) */
(function () {
  'use strict';
  var Q = new URLSearchParams(location.search);
  if (Q.has('capture')) document.body.classList.add('capture');
  var MODO = Q.get('modo') || 'pleno';
  // ?w=1920&h=1080 para la versión horizontal (por defecto 1080×1920)
  var SW = +(Q.get('w') || 1080), SH = +(Q.get('h') || 1920), stage = document.getElementById('stage'), cv = stage.querySelector('canvas');
  stage.style.width = SW + 'px'; stage.style.height = SH + 'px'; cv.width = SW; cv.height = SH;
  if (!Q.has('capture')) stage.style.transform = 'scale(' + Math.min(innerWidth / SW, innerHeight / SH) + ')';
  var WITH_INTRO = Q.get('intro') === '1';
  var G = RumorGrid(document.querySelector('#stage canvas'), { modo: MODO });
  var draw = G.draw, CYCLE = G.CYCLE, INTRO = G.INTRO, STEPS = G.STEPS;

  /* Tiempo determinista: seek(seg) dibuja el cuadro exacto (lo usa render.cjs).
     Se dibuja a 12 pasos por segundo, igual que el artefacto (estética "digital"). */
  window.DURATION = (WITH_INTRO ? INTRO : 0) + CYCLE;
  window.seek = function (sec) {
    if (WITH_INTRO && sec < INTRO) return draw(0, Math.floor(sec / INTRO * 24) / 24);
    var lt = ((sec - (WITH_INTRO ? INTRO : 0)) % CYCLE) / CYCLE;
    draw(Math.floor(lt * STEPS) / STEPS, -1);
  };

  if (!Q.has('capture')) {
    var t0 = performance.now();
    (function loop(ts) { window.seek(((ts - t0) / 1000) % window.DURATION); requestAnimationFrame(loop); })(t0);
  } else window.seek(0);
})();
</script>
</body>
</html>
