<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fondo portada BF · Rumor</title>
<style>
  /* ====== SOLO DEMO (no copiar) ====== */
  html,body{margin:0;background:#0e0e0e;color:#FFFCF1;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  .demo-wrap{padding:24px 16px 48px;max-width:1960px;margin:0 auto;display:grid;gap:28px}
  .demo-label{font-size:12px;letter-spacing:.08em;text-transform:uppercase;opacity:.55;margin:0 0 8px}
    .hero{position:relative;overflow:hidden;background:#191919;border-radius:4px}
  .hero--desk{width:100%;height:490px}
  .hero--mob{width:390px;max-width:100%;height:480px}
  /* ====== FIN DEMO ====== */
</style>

<!-- ================================================================
     BLOQUE A COPIAR · 1/3 · CSS
     El contenedor padre (la portada) tiene que tener position:relative.
     ================================================================ -->
<style>
  .rbf-bg{position:absolute;inset:0;z-index:0;overflow:hidden;background:#191919;pointer-events:none}
  .rbf-bg canvas{display:block;width:100%;height:100%}
</style>
</head>
<body>

<div class="demo-wrap">
  <div>
    <p class="demo-label">Vista previa · compu · 100% × 490 px</p>
    <section class="hero hero--desk">
      <!-- ================================================================
           BLOQUE A COPIAR · 2/3 · HTML (va como primer hijo de la portada)
           ================================================================ -->
      <div class="rbf-bg" aria-hidden="true"><canvas></canvas></div>
      <!-- ============================================================== -->
    </section>
  </div>
  <div>
    <p class="demo-label">Vista previa · celular · 390 × 480 px</p>
    <section class="hero hero--mob"><div class="rbf-bg" aria-hidden="true"><canvas></canvas></div></section>
  </div>
</div>

<!-- ================================================================
     BLOQUE A COPIAR · 3/3 · SCRIPT
     Inicializa todos los .rbf-bg de la página. Sin dependencias.
     ================================================================ -->
<script>
(function () {
  'use strict';

  /* ---------- Paleta Rumor ---------- */
  var C = { black: '#191919', blue: '#003AFE', blue2: '#0057FF', white: '#FFFCF1', red: '#E3262B' };

  /* ---------- Tiempo ----------
     Bucle perfecto de 12 s: 3 temas × 4 s. Todo es función de step % STEPS.
     Solo se redibuja cuando cambia el paso (12 por segundo): estética "digital" y muy poco CPU. */
  var CYCLE = 12000;
  var STEPS = 144;
  var INTRO = 1400;          // ms · arranque tipo "cargando" (solo la primera vez, fuera del bucle)
  var WIPE = 0.22;           // fracción de cada tema que dura el barrido al siguiente
  var STATIC_T = 0.12;       // momento usado con prefers-reduced-motion (tema azul)

  /* ---------- Zonas que quedan oscuras (compu) ----------
     Medido sobre la portada real: contenido centrado de 1300 px máx.,
     título hasta el 72% del contenido, contador centrado en el 91% / 57% del alto. */
  var LAYOUT = {
    contentMax: 1300, pad: 32,   // ancho máx. del contenido y margen lateral (px)
    textEnd: 0.72,               // hasta dónde llega el texto (fracción del contenido)
    counterX: 0.91, counterY: 0.57, counterR: 125, // centro y radio exterior del contador (px)
    topBar: 95                   // franja superior con logo y etiqueta (px)
  };

  /* ---------- Temas (dos valores por celda: apagada / prendida) ----------
     off: signo chico sobre negro · on: bloque de color con el signo opuesto
     thr: umbral de la mancha (más alto = menos superficie prendida)            */
  var THEMES = [
    { name: 'azul',   block: C.blue,  onInk: C.white, onG: ['+'],        offInk: C.blue2, offG: '-',   offA: 0.55, thr: -0.02 },
    { name: 'blanco', block: C.white, onInk: C.black, onG: ['%', '50'],  offInk: C.white, offG: 'dot', offA: 0.20, thr: 0.24 },
    { name: 'rojo',   block: C.red,   onInk: C.black, onG: ['-'],        offInk: C.red,   offG: '+',   offA: 0.50, thr: 0.02 }
  ];

  function hash(a, b, c) {
    var h = (Math.imul(a, 374761393) + Math.imul(b, 668265263) + Math.imul(c, 1274126177)) | 0;
    h = Math.imul(h ^ (h >>> 13), 1274126177);
    h ^= h >>> 16;
    return (h >>> 0) / 4294967296;
  }
  function smooth(e0, e1, x) { x = Math.min(1, Math.max(0, (x - e0) / (e1 - e0))); return x * x * (3 - 2 * x); }
  var TAU = 6.283185307;

  /* ---------- Signos vectoriales (sin fuentes remotas) ---------- */
  function drawGlyph(g, ctx, s, color) {
    ctx.fillStyle = color; ctx.strokeStyle = color;
    var t = Math.max(1, s * 0.12), L = s * 0.46;
    if (g === '+') { ctx.fillRect(-L / 2, -t / 2, L, t); ctx.fillRect(-t / 2, -L / 2, t, L); }
    else if (g === '-') { ctx.fillRect(-L / 2, -t / 2, L, t); }
    else if (g === 'dot') { ctx.beginPath(); ctx.arc(0, 0, s * 0.09, 0, TAU); ctx.fill(); }
    else if (g === '%') {
      var r = s * 0.1, o = s * 0.15;
      ctx.lineWidth = t * 0.8;
      ctx.beginPath(); ctx.arc(-o, -o, r, 0, TAU); ctx.stroke();
      ctx.beginPath(); ctx.arc(o, o, r, 0, TAU); ctx.stroke();
      ctx.lineWidth = t * 0.85;
      ctx.beginPath(); ctx.moveTo(L * 0.5, -L * 0.5); ctx.lineTo(-L * 0.5, L * 0.5); ctx.stroke();
    } else {
      ctx.font = '800 ' + Math.round(s * 0.5) + 'px ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(g, 0, s * 0.04);
    }
  }

  function sprite(px, block, g, ink) {
    var c = document.createElement('canvas'); c.width = c.height = px;
    var x = c.getContext('2d');
    if (block) x.fillStyle = block, x.fillRect(0, 0, px, px);   // bloques pegados: forman manchas continuas
    x.translate(px / 2, px / 2); drawGlyph(g, x, px, ink);
    return c;
  }
  function buildSprites(px) {
    return THEMES.map(function (T) {
      return {
        on: T.onG.map(function (g) { return sprite(px, T.block, g, T.onInk); }),
        off: sprite(px, null, T.offG, T.offInk)
      };
    });
  }

  function init(root) {
    var canvas = root.querySelector('canvas');
    if (!canvas) { canvas = document.createElement('canvas'); root.appendChild(canvas); }
    var ctx = canvas.getContext('2d', { alpha: false });

    var W = 0, H = 0, dpr = 1, cell = 20, cols = 0, rows = 0, ox = 0, oy = 0, px = 20;
    var U, WT, sprites;
    var lastKey = -1, raf = 0, inView = true;
    var tStart = 0, introDone = false;
    var rm = window.matchMedia ? window.matchMedia('(prefers-reduced-motion: reduce)') : { matches: false };

    function layout() {
      var r = root.getBoundingClientRect();
      W = Math.max(1, Math.round(r.width)); H = Math.max(1, Math.round(r.height));
      dpr = Math.min(window.devicePixelRatio || 1, 2);
      canvas.width = Math.round(W * dpr); canvas.height = Math.round(H * dpr);
      cell = Math.max(16, Math.min(24, Math.min(W, H) / 22));
      px = Math.ceil(cell * dpr);
      cols = Math.ceil(W / cell); rows = Math.ceil(H / cell);
      ox = (W - cols * cell) / 2; oy = (H - rows * cell) / 2;
      sprites = buildSprites(px);

      var a = smooth(0.85, 1.7, W / H);          // 0 = celu vertical · 1 = compu apaisada
      var cw = Math.min(W - 2 * LAYOUT.pad, LAYOUT.contentMax), cl = (W - cw) / 2;
      var tEnd = cl + LAYOUT.textEnd * cw, cX = cl + LAYOUT.counterX * cw, cY = H * LAYOUT.counterY;
      var n = cols * rows;
      U = new Float32Array(n); WT = new Float32Array(n);
      for (var j = 0; j < rows; j++) for (var i = 0; i < cols; i++) {
        var k = j * cols + i;
        var xn = (ox + (i + 0.5) * cell) / W, yn = (oy + (j + 0.5) * cell) / H;
        // Dirección del barrido entre temas
        U[k] = (xn * 0.45 + yn * 0.55) * (1 - a) + (xn * 0.85 + yn * 0.15) * a;
        // Presencia: celu → tercio inferior-derecho · compu → franja centro-derecha
        var wm = smooth(0.3, 0.85, yn) * (0.6 + 0.4 * xn);
        var X = xn * W, Y = yn * H;
        var wd = smooth(tEnd, tEnd + 0.07 * cw, X)                       // nada detrás del texto
               * smooth(LAYOUT.topBar * 0.7, LAYOUT.topBar * 1.15, Y);   // ni del logo / etiqueta
        var dc = Math.sqrt((X - cX) * (X - cX) + (Y - cY) * (Y - cY));
        wd *= smooth(LAYOUT.counterR, LAYOUT.counterR * 1.3, dc);                     // contador siempre limpio
        WT[k] = wm * (1 - a) + wd * a;
      }
      lastKey = -1;
    }

    /* Campo de manchas: suma de ondas con frecuencias temporales enteras → bucle exacto */
    function field(i, j, t) {
      var p = TAU * t;
      return (Math.sin(0.21 * i + 0.13 * j + p + 1.3) +
              Math.sin(-0.12 * i + 0.29 * j - p + 0.4) +
              Math.sin(0.33 * i - 0.17 * j + p + 2.1) * 0.8 +
              Math.sin(0.06 * i + 0.09 * j - 2 * p + 0.7) * 0.9 +
              Math.sin(0.52 * i + 0.41 * j - p + 4.2) * 0.45) / 3.6;
    }

    /* intro: 0..1 durante el arranque, o -1 si ya terminó */
    function draw(t, intro) {
      var step = Math.round(t * STEPS) % STEPS;
      var nT = THEMES.length, seg = t * nT, cur = Math.floor(seg) % nT, local = seg - Math.floor(seg);
      var nxt = (cur + 1) % nT;
      var wipeP = (local - (1 - WIPE)) / WIPE;   // <0: sin barrido · 0..1: barrido en curso

      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.globalAlpha = 1;
      ctx.fillStyle = C.black; ctx.fillRect(0, 0, canvas.width, canvas.height);

      var n = cols * rows;
      for (var k = 0; k < n; k++) {
        var i = k % cols, j = (k / cols) | 0;
        var w = WT[k];
        var h = hash(i, j, step);

        // Arranque: las celdas aparecen al azar y titilan antes de asentarse
        if (intro >= 0) {
          var appear = hash(i, j, 991);
          if (appear > intro) continue;
          if (intro - appear < 0.12) {
            var T0 = THEMES[0];
            var spr0 = h < 0.5 ? sprites[0].on[0] : sprites[0].off;
            ctx.globalAlpha = h < 0.5 ? 0.25 + 0.6 * w : T0.offA;
            ctx.drawImage(spr0, Math.round((ox + i * cell) * dpr), Math.round((oy + j * cell) * dpr));
            continue;
          }
        }

        // ¿Qué tema le toca a esta celda? (barrido con borde irregular)
        var th = cur, edge = false;
        if (wipeP >= 0) {
          var front = wipeP * 1.3 - 0.15;
          var d = U[k] + (hash(i, j, 7) - 0.5) * 0.12 - front;
          if (d < 0) th = nxt;
          edge = d > -0.05 && d < 0.05;
        }
        var T = THEMES[th], S = sprites[th];

        // Valor booleano de la celda
        var f = field(i, j, t) + (hash(i, j, 3) - 0.5) * 0.28;
        var thr = T.thr + (1 - w) * 1.1;
        var on = f > thr;
        if (edge && h < 0.45) on = !on;                          // el frente del barrido "voltea" celdas
        else if (Math.abs(f - thr) < 0.06 && h < 0.3) on = !on;  // bordes de las manchas titilan
        if (w < 0.15) on = false;                                // zona del texto: siempre oscura

        var x = Math.round((ox + i * cell) * dpr), y = Math.round((oy + j * cell) * dpr);
        if (on) {
          var g = S.on.length > 1 ? (hash(i, j, 11) < 0.6 ? 0 : 1) : 0;
          ctx.globalAlpha = 1;
          ctx.drawImage(S.on[g], x, y);
        } else {
          ctx.globalAlpha = T.offA * (0.35 + 0.65 * w);
          ctx.drawImage(S.off, x, y);
        }
      }
      ctx.globalAlpha = 1;
    }

    function now() { return performance.now(); }
    function frame(ts) {
      raf = 0;
      if (!running()) return;
      var el = ts - tStart;
      if (!introDone && el < INTRO) {
        var ip = Math.floor(el / INTRO * 24) / 24;          // también a pasos
        var key = -1000 - Math.round(ip * 24);
        if (key !== lastKey) { lastKey = key; draw(0, ip); }
      } else {
        if (!introDone) { introDone = true; tStart = ts - INTRO; }
        var lt = ((ts - tStart - INTRO) % CYCLE) / CYCLE;
        var s = Math.floor(lt * STEPS);
        if (s !== lastKey) { lastKey = s; draw(s / STEPS, -1); }
      }
      raf = requestAnimationFrame(frame);
    }
    function running() { return inView && !document.hidden && !rm.matches; }
    var pausedAt = 0;
    function update() {
      if (rm.matches) { if (raf) cancelAnimationFrame(raf); raf = 0; draw(STATIC_T, -1); lastKey = -2; return; }
      if (running()) {
        if (!raf) {
          if (pausedAt) { tStart += now() - pausedAt; pausedAt = 0; }   // retoma donde quedó
          raf = requestAnimationFrame(frame);
        }
      } else if (!pausedAt) pausedAt = now();
    }
    function redrawNow() {
      if (rm.matches) return draw(STATIC_T, -1);
      if (!introDone) return draw(0, 0);
      draw(Math.floor((((pausedAt || now()) - tStart - INTRO) % CYCLE) / CYCLE * STEPS) / STEPS, -1);
    }

    layout();
    tStart = now();
    redrawNow();

    if ('ResizeObserver' in window) {
      var pend = 0;
      new ResizeObserver(function () {
        if (pend) return;
        pend = requestAnimationFrame(function () { pend = 0; layout(); redrawNow(); });
      }).observe(root);
    } else {
      window.addEventListener('resize', function () { layout(); redrawNow(); });
    }
    if ('IntersectionObserver' in window) {
      new IntersectionObserver(function (e) { inView = e[e.length - 1].isIntersecting; update(); }).observe(root);
    }
    document.addEventListener('visibilitychange', update);
    if (rm.addEventListener) rm.addEventListener('change', update);
    update();
  }

  function start() { document.querySelectorAll('.rbf-bg').forEach(init); }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start); else start();
})();
</script>
<!-- ============================ FIN BLOQUE ============================ -->
</body>
</html>
